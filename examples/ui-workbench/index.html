<html lang="zh-CN">

  <style>

    .field-label{display:block;font-size:11px;color:var(--muted);margin-bottom:7px;font-weight:550}.priority-picker{display:flex;gap:8px;align-items:center;margin-bottom:11px}.priority-picker select{min-width:0;flex:1;border:1px solid #d7e1ec;border-radius:8px;background:white;font-size:12px;padding:9px 10px;color:var(--ink)}
    .btn{border:1px solid transparent;border-radius:9px;padding:10px 14px;display:inline-flex;justify-content:center;align-items:center;gap:7px;line-height:1.5;font-size:12px;font-weight:600;min-height:39px;transition:background .12s,box-shadow .12s}

</head>

    }
    function renderAssistant(){
      const t=getTicket(selectedId);if(!t){$('assistant-body').innerHTML='<p class="empty">选择一项请求，再查看建议。</p>';return;}
      const d=draftFor(t.id), busy=['partial','applying','unknown','reconciling'].includes(d.phase), locked=d.phase!=='idle';
      $('assistant-body').innerHTML=`<p class="assistant-context">围绕当前工单整理信息，帮助你决定接下来做什么。</p><section class="assistant-intro"><h3>${escapeHTML(t.recommendation)}</h3><p>${escapeHTML(t.reason)}</p><ul class="reason-points"><li>${icon('check')}<span>${escapeHTML(t.impact)}</span></li><li>${icon('check')}<span>${escapeHTML(t.urgency)}</span></li></ul></section>${t.status==='已解决'?'<div class="notice">这项请求已解决，无需再调整优先级。可以在中间查看处理记录。</div>':`<label class="field-label" for="priority-select">希望调整到</label><div class="priority-picker"><select id="priority-select" ${locked?'disabled':''}>${[1,2,3,4].map(p=>`<option value="${p}" ${d.desired===p?'selected':''}>P${p} · ${priorityNames[p]}${p===t.priority?'（当前）':''}</option>`).join('')}</select></div><button class="btn btn-primary btn-full" data-action="draft" ${locked||d.desired===t.priority?'disabled':''}>${icon('spark')}${locked?'已在处理这项调整':'起草优先级调整'}</button>${trackHTML(d.phase)}<div id="proposal-state" aria-live="polite" aria-atomic="false">${cardHTML(t,d)}</div><div class="scenario-box"><label for="scenario-select"><span>演示情境</span><select id="scenario-select" ${busy||locked?'disabled':''}><option value="normal" ${d.scenario==='normal'?'selected':''}>正常确认</option><option value="disconnect" ${d.scenario==='disconnect'?'selected':''}>建议生成中断</option><option value="unknown" ${d.scenario==='unknown'?'selected':''}>提交结果待确认</option></select></label><p class="scenario-note">仅在当前页面模拟交互，刷新后恢复初始状态。</p></div>`}`;
    }
    function render(){renderQueue();renderDetail();renderAssistant();}
    function currentTime(){return new Intl.DateTimeFormat('zh-CN',{hour:'2-digit',minute:'2-digit',hour12:false}).format(new Date());}
    function makeDraft(id,forceNormal=false){const t=getTicket(id),d=draftFor(id);if(!t||t.status==='已解决'||!['idle','interrupted'].includes(d.phase)||d.desired===t.priority)return;if(forceNormal)d.scenario='normal';d.phase='partial';d.token++;const token=d.token;renderAssistant();$('assistant-body').focus({preventScroll:true});announce('正在整理建议，内容尚未完整，不可审批。');window.setTimeout(()=>{if(d.token!==token||d.phase!=='partial')return;if(d.scenario==='disconnect'){d.phase='interrupted';announce('建议生成中断，工单没有变更。');}else{d.phase='draft';d.before=t.priority;d.after=d.desired;d.expectedVersion=t.version;d.reason=t.reason;announce('完整变更预览已准备好，请审查。');}if(selectedId===id)renderAssistant();},900);}
    function reviewDraft(){const t=getTicket(selectedId),d=t&&draftFor(t.id);if(!t||!['draft','awaiting_review'].includes(d.phase))return;if(view==='user'){d.phase='awaiting_review';renderAssistant();$('assistant-body').focus({preventScroll:true});announce('本地审查请求已准备，等待服务台运营人员审查。切换运营视图可继续演示。');return;}approvalTicketId=t.id;$('approval-description').innerHTML=`<p class="dialog-ticket">${t.id} · ${escapeHTML(t.title)}</p><div class="preview-label">本次将调整以下内容</div>${diffHTML(d.before,d.after)}<p class="preview-reason">${escapeHTML(d.reason)}</p><p class="dialog-note">本次为本地交互演示，不会修改真实工单。</p>`;$('approval-dialog').showModal();}
    function commitReceipt(id,receipt){const t=getTicket(id),d=draftFor(id),saved=simulationLedger.get(d.operationId);if(!saved||saved!==receipt||saved.ticketId!==id||saved.expectedVersion!==d.expectedVersion)return; // Only this mock ledger can confirm its own record.
      if(d.phase==='committed')return;t.priority=receipt.after;t.version=receipt.resultingVersion;d.receipt=receipt;d.phase='committed';t.activity.unshift({time:receipt.time,title:`优先级从「${priorityNames[receipt.before]}」调整为「${priorityNames[receipt.after]}」`,body:`林然确认了这项调整。模拟记录 ${receipt.id}。`,simulated:true});render();announce(`${t.id} 的本地模拟变更已确认，优先级调整为${priorityNames[t.priority]}。`);}
    function approveDraft(){const t=getTicket(approvalTicketId),d=t&&draftFor(t.id);$('approval-dialog').close();if(view!=='operator'||!t||!['draft','awaiting_review'].includes(d.phase))return;if(t.version!==d.expectedVersion||t.priority!==d.before){d.phase='idle';renderAssistant();$('priority-select')?.focus();announce('工单信息已经变化，请重新起草并审查。');return;}d.phase='applying';const operationSequence=++sequence;d.operationId=`SIM-${t.id}-${operationSequence}`;renderAssistant();$('assistant-body').focus({preventScroll:true});announce('正在确认你批准的模拟变更。');const id=t.id,operationId=d.operationId;window.setTimeout(()=>{if(d.phase!=='applying'||d.operationId!==operationId)return;const receipt={id:`REC-${id.slice(2)}-${String(operationSequence).padStart(2,'0')}`,ticketId:id,operationId,before:d.before,after:d.after,expectedVersion:d.expectedVersion,resultingVersion:d.expectedVersion+1,time:currentTime()};simulationLedger.set(operationId,receipt);if(d.scenario==='unknown'){d.phase='unknown';if(selectedId===id)renderAssistant();announce('处理结果暂未确认。请核对同一次调整，不要重复提交。');}else{commitReceipt(id,receipt);}},900);}
    function reconcile(){const t=getTicket(selectedId),d=t&&draftFor(t.id);if(!t||d.phase!=='unknown')return;d.phase='reconciling';renderAssistant();$('assistant-body').focus({preventScroll:true});announce('正在核对同一次调整的处理记录。');window.setTimeout(()=>{if(d.phase!=='reconciling')return;const receipt=simulationLedger.get(d.operationId);if(receipt)commitReceipt(t.id,receipt);else{d.phase='unknown';if(selectedId===t.id)renderAssistant();announce('仍未查到确定结果，请继续保留当前请求。');}},900);}
    function switchView(next){view=next;document.querySelectorAll('[data-view]').forEach(button=>{const active=button.dataset.view===view;button.setAttribute('aria-selected',String(active));button.tabIndex=active?0:-1;});$('mode-panel').setAttribute('aria-labelledby',`${view}-view`);$('workspace-title').textContent=view==='operator'?'服务工作台':'我的服务请求';$('workspace-subtitle').textContent=view==='operator'?'把信息看清，再推进下一步。':'查看进展，把需要协助的事情说明白。';$('profile-avatar').textContent=view==='operator'?'林':'周';$('profile-name').textContent=view==='operator'?'林然 · 服务运营':'周岚 · 品牌设计';if($('approval-dialog').open)$('approval-dialog').close();ensureSelection();render();announce(view==='operator'?'已切换到运营视图，可审查变更。':'已切换到用户视图，优先级调整需交由服务台审查。');}
    document.querySelectorAll('[data-view]').forEach(button=>button.addEventListener('click',()=>switchView(button.dataset.view)));
    document.querySelector('.view-switch').addEventListener('keydown',event=>{if(['ArrowLeft','ArrowRight','Home','End'].includes(event.key)){event.preventDefault();const next=['ArrowLeft','Home'].includes(event.key)?'user':'operator';switchView(next);$(`${next}-view`).focus();}});
    $('ticket-list').addEventListener('click',event=>{const button=event.target.closest('[data-ticket]');if(!button)return;selectedId=button.dataset.ticket;detailTab='detail';render();document.querySelector(`[data-ticket="${selectedId}"]`)?.focus({preventScroll:true});announce(`已打开 ${selectedId}。`);});
    $('ticket-list').addEventListener('keydown',event=>{if(!['ArrowDown','ArrowUp'].includes(event.key))return;const rows=Array.from(document.querySelectorAll('[data-ticket]')),index=rows.indexOf(document.activeElement);if(index<0)return;event.preventDefault();rows[(index+(event.key==='ArrowDown'?1:-1)+rows.length)%rows.length].focus();});
    document.querySelectorAll('[data-filter]').forEach(button=>button.addEventListener('click',()=>{filter=button.dataset.filter;ensureSelection();render();announce(`筛选后有 ${visibleTickets().length} 项请求。`);}));
    $('ticket-search').addEventListener('input',event=>{search=event.target.value.trim();ensureSelection();render();});
    $('ticket-main').addEventListener('click',event=>{const tab=event.target.closest('[data-detail-tab]');if(tab){detailTab=tab.dataset.detailTab;renderDetail();$(`${detailTab}-tab`).focus();}});
    $('ticket-main').addEventListener('keydown',event=>{if(!event.target.matches('[data-detail-tab]')||!['ArrowLeft','ArrowRight'].includes(event.key))return;event.preventDefault();detailTab=event.key==='ArrowLeft'?'detail':'activity';renderDetail();$(`${detailTab}-tab`).focus();});
    $('assistant-body').addEventListener('change',event=>{if(!selectedId)return;const d=draftFor(selectedId);if(d.phase!=='idle')return;if(event.target.id==='priority-select'){d.desired=Number(event.target.value);renderAssistant();$('priority-select')?.focus();}if(event.target.id==='scenario-select')d.scenario=event.target.value;});
    $('assistant-body').addEventListener('click',event=>{const button=event.target.closest('[data-action]');if(!button||button.disabled||!selectedId)return;const d=draftFor(selectedId);switch(button.dataset.action){case'draft':makeDraft(selectedId);break;case'retry':makeDraft(selectedId,true);break;case'review':reviewDraft();break;case'discard':if(['draft','awaiting_review'].includes(d.phase)){d.token++;d.phase='idle';renderAssistant();$('priority-select')?.focus();announce('草稿已放弃，工单没有变更。');}break;case'reconcile':reconcile();break;case'view-record':detailTab='activity';renderDetail();$('ticket-heading').focus();break;case'new':if(d.phase==='committed'){d.phase='idle';d.receipt=null;d.desired=getTicket(selectedId).priority===2?3:2;renderAssistant();$('priority-select')?.focus();}break;}});
    $('close-dialog').addEventListener('click',()=>$('approval-dialog').close());$('cancel-approval').addEventListener('click',()=>$('approval-dialog').close());$('confirm-approval').addEventListener('click',approveDraft);
    if(window.matchMedia('(max-width:760px)').matches){$('queue-panel').open=false;$('assistant-panel').open=false;}
    render();
  </script>
</body>
</html>
