# Adapt paths to your repository. This file is not installed automatically.
# Run adapters only from trusted reviewed code; do not expose secrets to untrusted PRs.
name: AGUI implementation evidence
on: [push, pull_request]
permissions:
  contents: read
jobs:
  invariants:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r plugins/agui-harness/requirements.txt
      - run: python plugins/agui-harness/scripts/harness.py --project . lint
      - run: python plugins/agui-harness/scripts/harness.py --project . run
      - run: python plugins/agui-harness/scripts/harness.py --project . gate --stage implementation
# A separately authorized staging workflow runs live/load checks and release gate.
# Add your application's dependencies and retain redacted evidence as CI artifacts.
